schema: spec-driven

context: |
  oe is a standalone Rust crate at the root of this repository. It holds
  the OE columnar event file format (Open Event File) and the OEJ
  append-only event journal (Open Event Journal). The OpenSpec corpus
  is the authoritative requirements baseline for the crate; the quality
  gate for spec work is `openspec validate --all --strict` passing.

  Layout and authority:
  - The corpus lives in openspec/specs/ (one oe-* capability per
    directory; each holds spec.md plus companion files).
  - Caution at archive time: `openspec archive` applies only requirement
    blocks from spec.md deltas. For a change that ADDs a new capability it
    generates a placeholder TBD Purpose and does not copy companion files;
    restore the real Purpose and copy companions manually after archiving.

rules:
  proposal:
    - Name capabilities in kebab-case with the oe- prefix, consistent with the existing corpus (e.g. oe-write-path, oe-file-layout).
  specs:
    - Specs must be self-contained; embed all normative content. Cross-references to other capability specs and named INV-* invariants are allowed.
    - Open every spec's `## Purpose` with a plain-English, specific summary a non-expert can follow (who uses it, what it does, what it produces). Keep real architectural terms but phrase them plainly; no jargon openers.
    - Put large schemas, registries, byte layouts, and example data in companion files inside the capability directory (e.g. file-layout.md, encodings.md); keep requirements in spec.md. Split a capability that grows too large into multiple capability specs.
    - After editing, run `openspec validate --all --strict` and fix every issue. Also check for requirement text dangling after a scenario with no `### Requirement:` heading; validate does not catch that class.
  design:
    - Record contested choices as tension, decision, why, and implied spec edits, including rejected alternatives and open sub-tensions.
  tasks:
    - Group tasks by capability and end with a verification task that runs `openspec validate <change> --strict`. Once implementation starts, each coding task should name the capability and requirement it implements.
